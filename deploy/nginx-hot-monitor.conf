# AI 热点监控 Nginx 站点配置
# 用法：将 SERVER_NAME 替换为实际域名后复制到 /etc/nginx/conf.d/ 并 reload
# 注意：本配置监听 80 端口，HTTPS 由 Cloudflare 接管（SSL 模式 Flexible）

server {
    listen 80;
    server_name hot.guohaoai.com;  # TODO: 替换为实际域名

    # 前端静态资源（本地构建产物，服务器不执行构建）
    root /opt/hot-monitor/client/dist;
    index index.html;

    # 静态资源缓存
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # SSE 推送：必须关闭缓冲、拉长超时
    location /api/events {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # 后端 API
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        proxy_buffering off;   # /hotspots/search 含 AI 分析，SSE 语义不缓冲更稳
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
